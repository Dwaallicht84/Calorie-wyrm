<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E1A38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Wyrm — a calorie log that feels like a game. Feed your dragon, keep your streak alive.">
<title>Wyrm · feed your dragon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   WYRM — a game-first calorie log
   ------------------------------------------------------------
   This file is one self-contained page: HTML + CSS + JS.
   Sections below are ordered to match the reading order of the
   page. Search for "EXTENSION POINT" comments in the <script>
   for places future features (targets, food DB, cosmetics, etc.)
   are expected to plug in later.
   ============================================================ */

:root{
  --bg-1:#1E1A38;
  --bg-2:#322659;
  --card:#FFF6E8;
  --card-edge:#F0DEB8;
  --card-inset:#FBEBCB;
  --ink:#2A2140;
  --ink-soft:#7A6B96;
  --ink-faint:#A99BC4;
  --flame-1:#FF7A45;
  --flame-2:#FFB23F;
  --flame-3:#FF4D6D;
  --teal:#2FBEA6;
  --teal-deep:#1F9986;
  --teal-soft:rgba(47,190,166,.18);
  --lilac:#8B7CD8;
  --white:#FFFFFF;
  --shadow-card: 0 16px 34px rgba(20,14,46,.38);
  --shadow-soft: 0 6px 16px rgba(20,14,46,.22);
  --radius-lg:28px;
  --radius-md:18px;
  --radius-sm:12px;
  --font-display:'Fredoka','Segoe UI Rounded',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  min-height:100%;
  font-family:var(--font-body);
  color:var(--ink);
  background:
    radial-gradient(circle at 50% -10%, var(--bg-2), var(--bg-1) 60%);
  background-attachment:fixed;
  position:relative;
  padding: calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 28px);
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:radial-gradient(rgba(255,255,255,.55) 1px, transparent 1.5px);
  background-size:46px 46px;
  opacity:.18;
  pointer-events:none;
  z-index:0;
}
button, input, select{ font-family:inherit; }
button{ cursor:pointer; }
input:focus-visible, select:focus-visible, button:focus-visible{
  outline: 3px solid var(--lilac);
  outline-offset: 2px;
}

.app{
  position:relative;
  z-index:1;
  max-width:480px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:18px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2px 0 4px;
}
.brand{
  font-family:var(--font-display);
  font-weight:700;
  letter-spacing:.06em;
  color:var(--white);
  font-size:15px;
  opacity:.85;
}

/* ---------- Nest card (dragon + xp + streak) ---------- */
.nest-card{
  position:relative;
  background:var(--card);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);
  padding:18px 20px 20px;
  overflow:hidden;
}
.nest-glow{
  position:absolute;
  inset:-20% -20% auto -20%;
  height:220px;
  background:radial-gradient(circle, rgba(255,178,63,.35), transparent 65%);
  pointer-events:none;
}
.dragon-stage-wrap{
  position:relative;
  height:172px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}
.dragon-stage-wrap svg{ display:none; }
.dragon-stage-wrap.stage-egg .egg-svg{ display:block; }
.dragon-stage-wrap.stage-baby .baby-svg{ display:block; }
.dragon-stage-wrap.stage-adult .adult-svg{ display:block; }

.egg-svg, .baby-svg, .adult-svg{
  width:150px; height:150px;
  transform-origin:50% 90%;
}
.egg-svg{ animation:wobble 4s ease-in-out infinite; }
.baby-svg, .adult-svg{ animation:bob 3s ease-in-out infinite; }
@keyframes wobble{ 0%,100%{transform:rotate(-3deg);} 50%{transform:rotate(3deg);} }
@keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }

.nest-svg{
  position:absolute;
  bottom:-6px; left:50%;
  transform:translateX(-50%);
  width:190px; height:auto;
  z-index:-1;
}

.xp-pop-wrap{
  position:absolute;
  left:0; right:0; top:8px;
  display:flex; justify-content:center;
  pointer-events:none;
  z-index:5;
}
.xp-pop-item{
  font-family:var(--font-display);
  font-weight:700;
  font-size:18px;
  color:var(--teal-deep);
  animation:floatFade 1.5s ease forwards;
}
@keyframes floatFade{
  0%{ opacity:0; transform:translateY(8px) scale(.9); }
  18%{ opacity:1; transform:translateY(0) scale(1); }
  75%{ opacity:1; }
  100%{ opacity:0; transform:translateY(-38px) scale(1); }
}

.dragon-name{
  font-family:var(--font-display);
  font-weight:600;
  font-size:20px;
  text-align:center;
  margin-top:2px;
}

.xp-bar-track{
  margin-top:12px;
  height:14px;
  border-radius:999px;
  background:var(--teal-soft);
  overflow:hidden;
}
.xp-bar-fill{
  height:100%;
  width:0%;
  border-radius:999px;
  background:linear-gradient(90deg, var(--teal-deep), var(--teal));
  transition:width .7s cubic-bezier(.2,.9,.3,1);
}
.xp-label{
  margin-top:6px;
  font-size:12.5px;
  color:var(--ink-soft);
  text-align:center;
  font-variant-numeric:tabular-nums;
}

.streak-row{
  margin-top:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.flame{
  font-size:22px;
  line-height:1;
  filter:drop-shadow(0 0 0 transparent);
  animation:flicker 2.2s ease-in-out infinite;
}
.flame::before{ content:"🔥"; }
.flame-1{ font-size:20px; }
.flame-2{ font-size:24px; filter:drop-shadow(0 0 6px rgba(255,178,63,.6)); }
.flame-3{ font-size:28px; filter:drop-shadow(0 0 10px rgba(255,122,69,.7)); }
.flame-4{ font-size:32px; filter:drop-shadow(0 0 14px rgba(255,77,109,.75)); }
@keyframes flicker{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.08); } }
.streak-text{
  font-family:var(--font-display);
  font-weight:600;
  font-size:15px;
}
.freeze-status{
  text-align:center;
  font-size:11.5px;
  margin-top:4px;
  color:var(--ink-faint);
}
.freeze-status.ready{ color:var(--teal-deep); }

/* ---------- Section shells ---------- */
.section-label{
  font-family:var(--font-display);
  font-weight:600;
  font-size:13px;
  letter-spacing:.03em;
  color:var(--white);
  opacity:.8;
  margin:0 2px 8px;
}
.card{
  background:var(--card);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-soft);
  padding:14px 16px;
}

/* ---------- Date pills ---------- */
.date-pills{
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
  padding-bottom:2px;
}
.date-pills::-webkit-scrollbar{ display:none; }
.date-pill{
  flex:0 0 auto;
  border:none;
  border-radius:999px;
  padding:8px 14px;
  font-weight:700;
  font-size:13px;
  background:var(--card-inset);
  color:var(--ink-soft);
  min-height:38px;
}
.date-pill.past{ background:transparent; border:1.5px dashed var(--card-edge); color:var(--ink-faint); }
.date-pill.selected{
  background:linear-gradient(90deg, var(--flame-1), var(--flame-2));
  color:var(--white);
  border:none;
}

/* ---------- Quick add chips ---------- */
.chip-row{
  display:flex;
  gap:10px;
  overflow-x:auto;
  scrollbar-width:none;
  padding-bottom:2px;
}
.chip-row::-webkit-scrollbar{ display:none; }
.chip{
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:2px;
  border:none;
  border-radius:var(--radius-sm);
  background:var(--card-inset);
  padding:8px 14px;
  min-height:48px;
  min-width:84px;
}
.chip-name{ font-weight:800; font-size:13px; }
.chip-cal{ font-size:11.5px; color:var(--ink-soft); }
.chip-empty{
  font-size:13px;
  color:rgba(255,255,255,.65);
  padding:8px 2px;
}

/* ---------- Log form ---------- */
.log-form{ display:flex; flex-direction:column; gap:10px; }
.form-row{ display:flex; gap:8px; }
input[type="text"], input[type="number"]{
  width:100%;
  border:1.5px solid var(--card-edge);
  background:var(--white);
  border-radius:var(--radius-sm);
  padding:12px 12px;
  font-size:16px;
  color:var(--ink);
  min-height:46px;
}
.form-row-cals{ align-items:center; }
.form-row-cals input{ flex:1; }
.link-btn{
  border:none; background:none;
  color:var(--teal-deep);
  font-weight:700;
  font-size:12.5px;
  white-space:nowrap;
  padding:6px 4px;
}
.primary-btn{
  border:none;
  border-radius:var(--radius-sm);
  background:linear-gradient(90deg, var(--teal-deep), var(--teal));
  color:var(--white);
  font-weight:800;
  font-size:15px;
  padding:0 20px;
  min-height:46px;
  white-space:nowrap;
}
.macros-row{ display:flex; gap:8px; }
.macros-row input{ text-align:center; }
.add-feedback{
  min-height:18px;
  margin-top:8px;
  text-align:center;
  font-weight:800;
  font-size:13px;
  color:var(--teal-deep);
  opacity:0;
  transform:translateY(-4px);
  transition:opacity .2s ease, transform .2s ease;
}
.add-feedback.show{ opacity:1; transform:translateY(0); }

/* ---------- Today log ---------- */
.today-header{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  font-family:var(--font-display);
  font-weight:600;
  font-size:16px;
  margin-bottom:8px;
}
#todayTotal{ font-variant-numeric:tabular-nums; color:var(--ink-soft); font-size:14px; }
#entryList{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.entry-row{ border-bottom:1px solid var(--card-inset); padding-bottom:8px; }
.entry-row:last-child{ border-bottom:none; padding-bottom:0; }
.entry-main{
  width:100%;
  background:none; border:none;
  display:flex; justify-content:space-between; align-items:center;
  padding:6px 2px;
  text-align:left;
}
.entry-name{ font-weight:700; font-size:14.5px; display:flex; align-items:center; gap:6px; }
.backdated-tag{ font-size:12px; opacity:.7; }
.entry-cal{ font-weight:700; font-size:14px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
.entry-macros{ font-size:11.5px; color:var(--ink-faint); padding:0 2px; }
.empty-state{ font-size:13.5px; color:var(--ink-soft); padding:10px 2px; }

/* ---------- Inline edit row ---------- */
.edit-row{ display:flex; flex-direction:column; gap:8px; padding:8px 2px; }
.edit-grid{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:6px; }
.edit-grid input{ padding:8px; font-size:14px; min-height:38px; }
.edit-date{
  border:1.5px solid var(--card-edge);
  border-radius:var(--radius-sm);
  padding:8px;
  font-size:13.5px;
  background:var(--white);
}
.edit-actions{ display:flex; gap:8px; }
.edit-actions button{
  flex:1;
  border:none;
  border-radius:var(--radius-sm);
  padding:9px 0;
  font-weight:700;
  font-size:13px;
}
.save-btn{ background:var(--teal-deep); color:var(--white); }
.delete-btn{ background:#FDEAEA; color:#C0435A; }
.cancel-btn{ background:var(--card-inset); color:var(--ink-soft); }

/* ---------- Banners ---------- */
.banner-wrap{
  position:fixed;
  top:calc(env(safe-area-inset-top) + 10px);
  left:0; right:0;
  display:flex; justify-content:center;
  z-index:20;
  pointer-events:none;
}
.banner{
  font-family:var(--font-display);
  font-weight:600;
  font-size:14px;
  background:var(--ink);
  color:var(--white);
  padding:10px 18px;
  border-radius:999px;
  box-shadow:var(--shadow-soft);
  opacity:0;
  transform:translateY(-14px);
  transition:opacity .35s ease, transform .35s ease;
  max-width:90vw;
  text-align:center;
}
.banner.show{ opacity:1; transform:translateY(0); }

@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
}
</style>
</head>
<body>

<div class="banner-wrap" id="bannerWrap"></div>

<div class="app">

  <div class="topbar"><span class="brand">🐲 WYRM</span></div>

  <header class="nest-card">
    <div class="nest-glow"></div>
    <div class="xp-pop-wrap" id="xpPopWrap"></div>

    <div class="dragon-stage-wrap" id="dragonStageWrap">
      <svg class="egg-svg" viewBox="0 0 220 220" aria-hidden="true">
        <ellipse cx="110" cy="140" rx="72" ry="88" fill="#F3E6C8" stroke="#C79A55" stroke-width="4"/>

    <div class="dragon-name" id="dragonName">Ember · Egg</div>
    <div class="xp-bar-track"><div class="xp-bar-fill" id="xpFill"></div></div>

    <div class="streak-row">
      <span class="flame flame-1" id="flameIcon"></span>
      <span class="streak-text" id="streakText">Log a meal to start your streak</span>

  <section>

<script>
/* ============================================================
   STATE + STORAGE
   ============================================================ */
const STORAGE_KEY = 'wyrmState_v1';

function defaultState(){
  return {
    version: 1,
    entries: [],            // {id,name,calories,protein,carbs,fat,date,backdated,loggedAt}
    totalXP: 0,
    allFoodNames: [],        // every food name ever logged (normalized), for the variety bonus
    streakMeta: { currentLength: 0, milestonesAwarded: [] },
    freezeLog: {}            // { [mondayDateStr]: true } — one freeze available per week
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    return Object.assign(defaultState(), JSON.parse(raw));
  }catch(e){
    console.warn('Wyrm: could not read saved data, starting fresh.', e);
    return defaultState();
  }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn('Wyrm: could not save data.', e); }
}

let state = loadState();
let ui = { selectedDate: null, macrosOpen: false, editingId: null };

/* ============================================================
   DATE HELPERS (all dates are local 'YYYY-MM-DD' strings)
   ============================================================ */
function todayStr(d = new Date()){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function addDaysStr(dateStr, delta){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()+delta);
  return todayStr(dt);
}
function isoMondayOf(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const day = dt.getDay(); // 0=Sun..6=Sat
  const diff = (day === 0 ? -6 : 1 - day);
  dt.setDate(dt.getDate()+diff);
  return todayStr(dt);
}
function pillLabel(dateStr, delta){
  if(delta === 0) return 'Today';
  if(delta === -1) return 'Yesterday';
  const [y,m,d] = dateStr.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined,{ weekday:'short', day:'numeric' });
}
function headerLabel(dateStr){
  const t = todayStr();
  if(dateStr === t) return 'Today';
  if(dateStr === addDaysStr(t,-1)) return 'Yesterday';
  const [y,m,d] = dateStr.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined,{ weekday:'short', month:'short', day:'numeric' });
}

/* ============================================================
   GAME RULES — dragon stages, XP, streaks
   (Tune these numbers freely; nothing else depends on the exact values.)
   ============================================================ */
const STAGES = [
  { key:'egg',   min:0,   max:149,      label:'Egg',          nextLabel:'XP to hatch' },
  { key:'baby',  min:150, max:499,      label:'Baby Dragon',  nextLabel:'XP to grow up' },
  { key:'adult', min:500, max:Infinity, label:'Adult Dragon', nextLabel:null }
  // EXTENSION POINT: additional stages/cosmetic unlocks could be appended here later.
];
function getStage(xp){ return STAGES.find(s => xp >= s.min && xp <= s.max) || STAGES[STAGES.length-1]; }

const MILESTONES = [ {days:3, xp:50}, {days:7, xp:100}, {days:30, xp:300} ];
const BACKDATE_DAYS = 7;     // how many days into the past you can log/edit (plus today)
const BASE_LOG_XP = 10;      // every log earns this
const FIRST_LOG_BONUS = 20;  // first entry logged for a given date
const NEW_FOOD_BONUS = 15;   // trying a food you've never logged before

/* Streak is always derived fresh from `entries` + `freezeLog` — never stored
   as an independent counter — so retroactive backdating "just works". */
function computeStreak(entries, freezeLog){
  const dateSet = new Set(entries.map(e => e.date));
  const workingFreeze = { ...freezeLog };
  const today = todayStr();
  let cursor = dateSet.has(today) ? today : addDaysStr(today, -1);
  let daysBack = (cursor === today) ? 0 : 1;
  let length = 0;
  const frozenDates = [];

  while(true){
    if(dateSet.has(cursor)){
      length++;
    } else if(daysBack > BACKDATE_DAYS){
      // Beyond the backdating window — the only way this day can still be
      // forgiven is the weekly streak freeze.
      const wk = isoMondayOf(cursor);
      if(!workingFreeze[wk]){
        workingFreeze[wk] = true;
        frozenDates.push(cursor);
        // day is forgiven but not counted itself — it just doesn't break the chain
      } else {
        break;
      }
    } else {
      break; // still within the backdating window — a real gap, not yet resolved
    }
    cursor = addDaysStr(cursor, -1);
    daysBack++;
  }
  return { length, workingFreeze, frozenDates };
}

function updateStreakAndMilestones(){
  const prevLength = state.streakMeta.currentLength;
  const { length, workingFreeze, frozenDates } = computeStreak(state.entries, state.freezeLog);
  state.freezeLog = workingFreeze;
  state.streakMeta.currentLength = length;
  if(length < prevLength){
    state.streakMeta.milestonesAwarded = state.streakMeta.milestonesAwarded.filter(m => m <= length);
  }
  let bonusXP = 0, highestMilestone = null;
  for(const m of MILESTONES){
    if(length >= m.days && !state.streakMeta.milestonesAwarded.includes(m.days)){
      state.streakMeta.milestonesAwarded.push(m.days);
      bonusXP += m.xp;
      highestMilestone = m.days;
    }
  }
  return { prevLength, newLength:length, bonusXP, highestMilestone, freezeJustUsed: frozenDates.length > 0 };
}

/* ============================================================
   ENTRIES — add / edit / delete
   ============================================================ */
function numOrNull(v){ return (v === '' || v == null) ? null : Number(v); }

function addEntry({ name, calories, protein, carbs, fat, date }){
  const today = todayStr();
  const normalized = name.trim().toLowerCase();
  const isNewFood = !state.allFoodNames.includes(normalized);
  const isFirstForDate = !state.entries.some(e => e.date === date);

  const entry = {
    id: 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    name: name.trim(),
    calories: Number(calories) || 0,
    protein: numOrNull(protein),
    carbs: numOrNull(carbs),
    fat: numOrNull(fat),
    date,
    backdated: date !== today,
    loggedAt: Date.now()
  };
  state.entries.push(entry);
  if(isNewFood) state.allFoodNames.push(normalized);

  let xpGained = BASE_LOG_XP;
  if(isFirstForDate) xpGained += FIRST_LOG_BONUS;
  if(isNewFood) xpGained += NEW_FOOD_BONUS;

  const stageBefore = getStage(state.totalXP).key;
  const { newLength, bonusXP, highestMilestone, freezeJustUsed } = updateStreakAndMilestones();
  xpGained += bonusXP;
  state.totalXP += xpGained;
  const stageAfter = getStage(state.totalXP).key;

  saveState();
  render();
  playFeedback({ xpGained, newLength, highestMilestone, freezeJustUsed, stageBefore, stageAfter });
}

function editEntry(id, fields){
  const e = state.entries.find(x => x.id === id);
  if(!e) return;
  if(fields.name != null && fields.name.trim() !== '') e.name = fields.name.trim();
  if(fields.calories != null && fields.calories !== '') e.calories = Number(fields.calories) || 0;
  e.protein = numOrNull(fields.protein);
  e.carbs = numOrNull(fields.carbs);
  e.fat = numOrNull(fields.fat);
  if(fields.date && fields.date !== e.date){
    e.date = fields.date;
    e.backdated = fields.date !== todayStr();
  }
  updateStreakAndMilestones(); // edits never remove XP already earned — only recompute streak coverage
  saveState();
  ui.editingId = null;
  render();
}

function deleteEntry(id){
  state.entries = state.entries.filter(x => x.id !== id);
  updateStreakAndMilestones();
  saveState();
  ui.editingId = null;
  render();
}

/* ============================================================
   QUICK-ADD FOODS (recent + frequent, blended)
   EXTENSION POINT: swap this for a real food-database search later —
   the chip UI just needs {name, calories, protein, carbs, fat}.
   ============================================================ */
function buildQuickFoods(){
  const map = new Map();
  for(const e of state.entries){
    const key = e.name.trim().toLowerCase();
    const cur = map.get(key);
    if(cur){
      cur.count++;
      if(e.loggedAt > cur.lastLoggedAt){
        Object.assign(cur, { name:e.name, calories:e.calories, protein:e.protein, carbs:e.carbs, fat:e.fat, lastLoggedAt:e.loggedAt });
      }
    } else {
      map.set(key, { name:e.name, calories:e.calories, protein:e.protein, carbs:e.carbs, fat:e.fat, count:1, lastLoggedAt:e.loggedAt });
    }
  }
  return Array.from(map.values())
    .sort((a,b) => (b.count - a.count) || (b.lastLoggedAt - a.lastLoggedAt))
    .slice(0, 8);
}

/* ============================================================
   RENDER
   ============================================================ */
function qs(sel){ return document.querySelector(sel); }
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function flameLevelClass(streak){
  if(streak >= 30) return 'flame-4';
  if(streak >= 7) return 'flame-3';
  if(streak >= 3) return 'flame-2';
  return 'flame-1';
}

function renderDragon(){
  const stage = getStage(state.totalXP);
  qs('#dragonStageWrap').className = 'dragon-stage-wrap stage-' + stage.key;
  qs('#dragonName').textContent = `Ember · ${stage.label}`;

  let pct, label;
  if(stage.nextLabel){
    const span = stage.max - stage.min + 1;
    pct = Math.min(100, Math.round(((state.totalXP - stage.min) / span) * 100));
    label = `${state.totalXP.toLocaleString()} / ${(stage.max+1).toLocaleString()} ${stage.nextLabel}`;
  } else {
    pct = 100;
    label = `${state.totalXP.toLocaleString()} XP · fully grown`;
    // EXTENSION POINT: cosmetic unlocks for the maxed-out adult stage could hook in here.
  }
  qs('#xpFill').style.width = pct + '%';
  qs('#xpLabel').textContent = label;

  const streak = state.streakMeta.currentLength;
  qs('#streakText').textContent = streak > 0 ? `Day ${streak} streak` : 'Log a meal to start your streak';
  qs('#flameIcon').className = 'flame ' + flameLevelClass(streak);

  const freezeUsed = !!state.freezeLog[isoMondayOf(todayStr())];
  const freezeEl = qs('#freezeStatus');
  freezeEl.textContent = freezeUsed ? '❄️ Freeze used this week' : '❄️ Freeze ready';
  freezeEl.className = 'freeze-status ' + (freezeUsed ? 'used' : 'ready');
}

function renderDatePills(){
  const wrap = qs('#datePills');
  wrap.innerHTML = '';
  const today = todayStr();
  for(let i = 0; i >= -BACKDATE_DAYS; i--){
    const dateStr = addDaysStr(today, i);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'date-pill' + (dateStr === ui.selectedDate ? ' selected' : '') + (i !== 0 ? ' past' : '');
    btn.textContent = pillLabel(dateStr, i);
    btn.addEventListener('click', () => { ui.selectedDate = dateStr; render(); });
    wrap.appendChild(btn);
  }
}

function renderChips(){
  const wrap = qs('#chipRow');
  wrap.innerHTML = '';
  const foods = buildQuickFoods();
  if(foods.length === 0){
    wrap.innerHTML = '<div class="chip-empty">Log a few meals and they\'ll show up here for one-tap logging.</div>';
    return;
  }
  for(const f of foods){
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.innerHTML = `<span class="chip-name">${escapeHtml(f.name)}</span><span class="chip-cal">${f.calories} cal</span>`;
    chip.addEventListener('click', () => addEntry({ name:f.name, calories:f.calories, protein:f.protein, carbs:f.carbs, fat:f.fat, date:ui.selectedDate }));
    wrap.appendChild(chip);
  }
}

function macroSummary(e){
  if(e.protein == null && e.carbs == null && e.fat == null) return '';
  const parts = [];
  if(e.protein != null) parts.push(`P${e.protein}`);
  if(e.carbs != null) parts.push(`C${e.carbs}`);
  if(e.fat != null) parts.push(`F${e.fat}`);
  return `<div class="entry-macros">${parts.join(' · ')}</div>`;
}

function buildEditRow(e){
  const wrap = document.createElement('div');
  wrap.className = 'edit-row';
  wrap.innerHTML = `
    <input type="text" class="edit-name" value="${escapeHtml(e.name)}" aria-label="Food name">
    <div class="edit-grid">
      <input type="number" inputmode="numeric" class="edit-cal" value="${e.calories}" placeholder="Calories" aria-label="Calories">
      <input type="number" inputmode="numeric" class="edit-protein" value="${e.protein ?? ''}" placeholder="Protein g" aria-label="Protein">
      <input type="number" inputmode="numeric" class="edit-carbs" value="${e.carbs ?? ''}" placeholder="Carbs g" aria-label="Carbs">
      <input type="number" inputmode="numeric" class="edit-fat" value="${e.fat ?? ''}" placeholder="Fat g" aria-label="Fat">
    </div>
    <select class="edit-date" aria-label="Date"></select>
    <div class="edit-actions">
      <button type="button" class="save-btn">Save</button>
      <button type="button" class="delete-btn">Delete</button>
      <button type="button" class="cancel-btn">Cancel</button>
    </div>
  `;
  const dateSelect = wrap.querySelector('.edit-date');
  const today = todayStr();
  for(let i = 0; i >= -BACKDATE_DAYS; i--){
    const d = addDaysStr(today, i);
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = headerLabel(d);
    if(d === e.date) opt.selected = true;
    dateSelect.appendChild(opt);
  }
  wrap.querySelector('.save-btn').addEventListener('click', () => editEntry(e.id, {
    name: wrap.querySelector('.edit-name').value,
    calories: wrap.querySelector('.edit-cal').value,
    protein: wrap.querySelector('.edit-protein').value,
    carbs: wrap.querySelector('.edit-carbs').value,
    fat: wrap.querySelector('.edit-fat').value,
    date: dateSelect.value
  }));
  wrap.querySelector('.delete-btn').addEventListener('click', () => deleteEntry(e.id));
  wrap.querySelector('.cancel-btn').addEventListener('click', () => { ui.editingId = null; render(); });
  return wrap;
}

function renderEntryList(){
  const list = qs('#entryList');
  const emptyState = qs('#emptyState');
  qs('#logDateLabel').textContent = headerLabel(ui.selectedDate);

  const dayEntries = state.entries.filter(e => e.date === ui.selectedDate).sort((a,b) => a.loggedAt - b.loggedAt);
  const total = dayEntries.reduce((sum,e) => sum + e.calories, 0);
  qs('#todayTotal').textContent = `${total.toLocaleString()} cal`;
  // EXTENSION POINT: a calorie target/budget comparison would render next to this total.

  list.innerHTML = '';
  if(dayEntries.length === 0){
    emptyState.hidden = false;
    emptyState.textContent = ui.selectedDate === todayStr()
      ? 'No food logged yet today — add your first meal above.'
      : 'No food logged for this day yet.';
    return;
  }
  emptyState.hidden = true;

  for(const e of dayEntries){
    const li = document.createElement('li');
    li.className = 'entry-row';
    if(ui.editingId === e.id){
      li.appendChild(buildEditRow(e));
    } else {
      li.innerHTML = `
        <button type="button" class="entry-main">
          <span class="entry-name">${e.backdated ? '<span class="backdated-tag" title="Logged after the fact">🕓</span>' : ''}${escapeHtml(e.name)}</span>
          <span class="entry-cal">${e.calories} cal</span>
        </button>
        ${macroSummary(e)}
      `;
      li.querySelector('.entry-main').addEventListener('click', () => { ui.editingId = e.id; render(); });
    }
    list.appendChild(li);
  }
}

function render(){
  renderDragon();
  renderDatePills();
  renderChips();
  renderEntryList();
}

/* ============================================================
   INSTANT FEEDBACK — xp pop, milestone / evolution banners
   ============================================================ */
function showXpPop(amount){
  const pop = document.createElement('div');
  pop.className = 'xp-pop-item';
  pop.textContent = `+${amount} XP`;
  qs('#xpPopWrap').appendChild(pop);
  setTimeout(() => pop.remove(), 1500);
}
function showBanner(text){
  const banner = document.createElement('div');
  banner.className = 'banner';
  banner.textContent = text;
  qs('#bannerWrap').appendChild(banner);
  requestAnimationFrame(() => banner.classList.add('show'));
  setTimeout(() => {
    banner.classList.remove('show');
    setTimeout(() => banner.remove(), 400);
  }, 2600);
}
function showInlineFeedback(text){
  const el = qs('#addFeedback');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(showInlineFeedback._timer);
  showInlineFeedback._timer = setTimeout(() => el.classList.remove('show'), 1800);
}
function playFeedback({ xpGained, highestMilestone, freezeJustUsed, stageBefore, stageAfter }){
  showXpPop(xpGained);
  // The dragon card can scroll out of view once the keyboard opens on mobile,
  // so this inline line (right under the Add button) is the guaranteed-visible
  // confirmation — it's what actually answers "did that work?".
  showInlineFeedback(`✓ Added — +${xpGained} XP`);
  if(stageBefore !== stageAfter){
    showBanner(stageAfter === 'baby' ? '🥚💥 Ember hatched into a Baby Dragon!' : '✨ Ember grew into an Adult Dragon!');
  } else if(highestMilestone){
    const m = MILESTONES.find(mm => mm.days === highestMilestone);
    showBanner(`🔥 ${highestMilestone}-day streak! +${m.xp} XP`);
  } else if(freezeJustUsed){
    showBanner('❄️ Used your weekly freeze to protect your streak');
  }
}

/* ============================================================
   FORM WIRING + INIT
   ============================================================ */
function setupForm(){
  const macrosToggle = qs('#toggleMacros');
  const macrosRow = qs('#macrosRow');
  macrosToggle.addEventListener('click', () => {
    ui.macrosOpen = !ui.macrosOpen;
    macrosRow.hidden = !ui.macrosOpen;
    macrosToggle.textContent = ui.macrosOpen ? '- macros' : '+ macros';
  });

  qs('#logForm').addEventListener('submit', (evt) => {
    evt.preventDefault();
    try{
      const nameInput = qs('#foodName');
      const calInput = qs('#foodCals');
      const name = nameInput.value.trim();
      if(!name || calInput.value === '') return;
      addEntry({
        name, calories: calInput.value,
        protein: qs('#foodProtein').value,
        carbs: qs('#foodCarbs').value,
        fat: qs('#foodFat').value,
        date: ui.selectedDate
      });
      nameInput.value = '';
      calInput.value = '';
      qs('#foodProtein').value = '';
      qs('#foodCarbs').value = '';
      qs('#foodFat').value = '';
      nameInput.focus();
    }catch(err){
      showFatalError('Add failed: ' + err.message);
    }
  });
}

document.addEventListener('DOMContentLoaded', () => {
  try{
    ui.selectedDate = todayStr();
    setupForm();
    updateStreakAndMilestones(); // sync streak/freeze silently in case a day rolled over while closed
    saveState();
    render();
  }catch(err){
    showFatalError('Startup error: ' + err.message);
  }
});

window.addEventListener('error', (e) => showFatalError('Script error: ' + e.message));

function showFatalError(text){
  let el = document.getElementById('fatalError');
  if(!el){
    el = document.createElement('div');
    el.id = 'fatalError';
    el.style.cssText = 'position:fixed;left:10px;right:10px;bottom:10px;z-index:9999;background:#C0435A;color:#fff;padding:12px 14px;border-radius:12px;font-family:sans-serif;font-size:13px;box-shadow:0 6px 16px rgba(0,0,0,.4);';
    document.body.appendChild(el);
  }
  el.textContent = '⚠️ ' + text + ' — please screenshot this and share it.';
}
</script>
